<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Condominio Vista Verde – Prototipo</title>
<style>
:root{--p:#2F7D4F;--pd:#1B4D33;--pl:#E8F3EC;--bg:#F7F9F7;--card:#fff;--tx:#1F2A24;--mut:#5A6B61;--ac:#F2A93B;--ok:#2E7D32;--pen:#B7791F;--bad:#C0392B;--inf:#2B6CB0;--bd:#D5E2DA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#1A241D;--tx:#EAF1EC;--mut:#A3B5AA;--pl:#22332A;--bd:#2D3F34;--p:#3E9A63}}
:root[data-theme="dark"]{--bg:#101712;--card:#1A241D;--tx:#EAF1EC;--mut:#A3B5AA;--pl:#22332A;--bd:#2D3F34;--p:#3E9A63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.side{flex:1 1 230px;max-width:300px}
.side h1{font-size:20px;color:var(--pd);margin:0 0 4px}.side p{margin:0 0 12px;color:var(--mut);font-size:14px}
.side button{display:block;width:100%;text-align:left;margin:0 0 6px;padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.side button.on{background:var(--p);border-color:var(--p);color:#fff}
.side small{display:block;color:var(--mut);margin-top:10px;font-size:12px}
.phone{width:380px;max-width:100%;height:760px;border:10px solid #1B2A22;border-radius:38px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{background:var(--p);color:#fff;padding:16px 18px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.top span{font-size:13px;font-weight:400;opacity:.9}
.body{flex:1;overflow-y:auto;padding:16px}
.nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
.nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
.nav button b{display:block;font-size:20px}.nav button.on{color:var(--p);font-weight:700}
h2{font-size:20px;margin:0 0 12px;color:var(--pd)}h3{font-size:16px;margin:16px 0 8px}
:root[data-theme="dark"] h2,:root[data-theme="dark"] .big{color:#9fe0b8}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hl{background:var(--pl)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.big{font-size:30px;font-weight:700;color:var(--pd)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.ok{background:var(--ok)}.pen{background:var(--pen)}.bad{background:var(--bad)}.inf{background:var(--inf)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card);color:var(--p);border:2px solid var(--p)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{padding:10px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--p);background:var(--pl);font-weight:700}.chip.dis{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.logo{width:76px;height:76px;border-radius:22px;background:var(--p);color:#fff;font-size:40px;display:grid;place-items:center;margin:20px auto 10px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin:10px 0 4px}
.bars div{flex:1;background:var(--p);border-radius:6px 6px 0 0;position:relative}
.bars div i{position:absolute;top:-18px;left:0;right:0;text-align:center;font:normal 12px sans-serif;color:var(--mut)}
.lab{display:flex;gap:10px}.lab span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.toast{background:var(--ok);color:#fff;padding:12px;border-radius:12px;margin-top:12px;font-weight:600}
.ph{border:2px dashed var(--bd);border-radius:12px;padding:16px;text-align:center;color:var(--mut);margin-bottom:10px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="side">
<h1>Condominio Vista Verde</h1>
<p>Prototipo visual. Elige una pantalla o navega dentro del celular.</p>
<div id="menu"></div>
<small>Pantallas de evidencia para el informe 3. Cada una indica su caso de uso (CU) y requerimiento (RF).</small>
</div>
<div class="phone"><div id="top" class="top"></div><div id="body" class="body"></div><div id="nav" class="nav"></div></div>
</div>
<script>
var R='Residente',cur='login',sel={d:1,h:'10:00 – 14:00'};
var L=[['login','1. Inicio de sesión (CU-01, RF-01)'],['inicio','2. Inicio del residente'],['boleta','3. Boleta de gastos (CU-03, RF-02)'],['pago','4. Pago de gastos (CU-04, RF-02)'],['reservar','5. Reservar espacio (CU-06, RF-03)'],['incidente','6. Crear incidente (CU-08, RF-04)'],['avisos','7. Comunicados (CU-15, RF-05)'],['bandeja','8. Bandeja del conserje (CU-09)'],['reportes','9. Reportes del comité (CU-13, RF-06)']];
var role={login:'',inicio:'Residente',boleta:'Residente',pago:'Residente',reservar:'Residente',incidente:'Residente',avisos:'Residente',bandeja:'Conserje',reportes:'Comité'};
var NAV={Residente:[['inicio','🏠','Inicio'],['boleta','💳','Gastos'],['reservar','📅','Reservas'],['incidente','🛠️','Incidentes'],['avisos','📢','Avisos']],Conserje:[['bandeja','🛠️','Incidentes'],['avisos','📢','Avisos']],'Comité':[['reportes','📊','Reportes'],['avisos','📢','Avisos']]};
var S={
login:function(){return '<div class="logo">🌿</div><h2 style="text-align:center">Condominio Vista Verde</h2><p class="mut" style="text-align:center">Ingresa a tu cuenta</p><label>Correo</label><input value="maria.gonzalez@correo.cl"><label>Contraseña</label><input type="password" value="••••••••"><label>Perfil</label><div class="chips">'+['Residente','Conserje','Comité','Administrador'].map(function(x){return '<button class="chip'+(x==R?' on':'')+'" onclick="R=\''+x+'\';draw()">'+x+'</button>'}).join('')+'</div><button class="btn" onclick="go(R==\'Conserje\'?\'bandeja\':R==\'Comité\'?\'reportes\':\'inicio\')">Iniciar sesión</button>'},
inicio:function(){return '<h2>Hola, María</h2><p class="mut" style="margin-top:-8px">Departamento 502 · Edificio B</p><div class="card hl"><div class="mut">Gasto común octubre</div><div class="row"><span class="big">$87.450</span><span class="tag pen">Pendiente</span></div><div class="mut">Vence el 10-10-2026</div><button class="btn" onclick="go(\'pago\')">Pagar ahora</button></div><div class="card"><b>Próxima reserva</b><div class="mut">Quincho · sáb 17-10 · 12:00 a 16:00</div><span class="tag ok">Confirmada</span></div><h3>Último comunicado</h3><div class="card" onclick="go(\'avisos\')"><b>Corte de agua programado</b><div class="mut">Edificio B · jueves 08-10, 10:00 a 13:00</div></div><div class="card"><b>Mi incidente</b><div class="mut">Ampolleta quemada, piso 5</div><span class="tag inf">En revisión</span></div>'},
boleta:function(){return '<h2>Gastos comunes</h2><div class="card hl"><div class="row"><b>Octubre 2026</b><span class="tag pen">Pendiente</span></div><div class="big">$87.450</div><div class="mut">Vence el 10-10-2026</div></div><h3>Detalle</h3><div class="card"><div class="row"><span>Administración</span><b>$32.000</b></div><div class="row"><span>Mantención ascensores</span><b>$14.200</b></div><div class="row"><span>Áreas verdes</span><b>$9.800</b></div><div class="row"><span>Consumo de agua</span><b>$18.450</b></div><div class="row"><span>Fondo de reserva</span><b>$13.000</b></div></div><h3>Historial</h3><div class="card"><div class="row"><span>Septiembre 2026</span><span class="tag ok">Pagada</span></div><div class="row" style="margin-top:8px"><span>Agosto 2026</span><span class="tag ok">Pagada</span></div></div><button class="btn" onclick="go(\'pago\')">Pagar boleta</button>'},
pago:function(){return '<h2>Pagar gastos comunes</h2><div class="card"><div class="row"><span>Periodo</span><b>Octubre 2026</b></div><div class="row"><span>Departamento</span><b>502 · Edificio B</b></div><div class="row"><span>Total a pagar</span><b class="big" style="font-size:24px">$87.450</b></div></div><label>Medio de pago</label><div class="chips"><button class="chip on">Tarjeta de débito</button><button class="chip">Tarjeta de crédito</button><button class="chip">Transferencia</button></div><p class="mut">🔒 Serás redirigido al portal de pagos con conexión cifrada.</p><div id="res"></div><button class="btn" onclick="document.getElementById(\'res\').innerHTML=\'<div class=toast>✔ Pago aprobado. Comprobante N° 20261003-0417 enviado a tu correo.</div>\'">Ir al portal de pagos</button>'},
reservar:function(){var d=['Sáb 17','Dom 18','Sáb 24','Dom 25'],h=['10:00 – 14:00','14:00 – 18:00','18:00 – 22:00'];return '<h2>Reservar espacio</h2><label>Espacio</label><select><option>Quincho</option><option>Sala multiuso</option></select><label>Fecha</label><div class="chips">'+d.map(function(x,i){return '<button class="chip'+(sel.d==i?' on':'')+'" onclick="sel.d='+i+';draw()">'+x+'</button>'}).join('')+'</div><label>Horarios disponibles</label><div class="chips">'+h.map(function(x,i){return i==1?'<button class="chip dis">'+x+'</button>':'<button class="chip'+(sel.h==x?' on':'')+'" onclick="sel.h=\''+x+'\';draw()">'+x+'</button>'}).join('')+'</div><div class="card hl mut">Reserva: Quincho · '+d[sel.d]+' oct · '+sel.h+'</div><div id="res"></div><button class="btn" onclick="document.getElementById(\'res\').innerHTML=\'<div class=toast>✔ Reserva confirmada. Te avisaremos antes de la fecha.</div>\'">Confirmar reserva</button>'},
incidente:function(){return '<h2>Nuevo incidente</h2><label>Tipo</label><select><option>Avería</option><option>Reclamo</option><option>Seguridad</option></select><label>Ubicación</label><input value="Edificio B, piso 5, pasillo"><label>Descripción</label><textarea rows="4">La luz del pasillo no enciende desde el lunes.</textarea><label>Fotos</label><div class="ph">📷 Adjuntar fotos (opcional)</div><div id="res"></div><button class="btn" onclick="document.getElementById(\'res\').innerHTML=\'<div class=toast>✔ Incidente #128 creado. Puedes seguir su estado en Mis incidentes.</div>\'">Enviar incidente</button>'},
avisos:function(){return '<h2>Comunicados</h2>'+[['Corte de agua programado','Edificio B · jue 08-10, 10:00 a 13:00','Nuevo','inf'],['Asamblea de copropietarios','Sábado 24-10 a las 11:00 en el salón','Importante','pen'],['Mantención de ascensores','Edificio A y C · lunes 05-10','Aviso','ok']].map(function(a){return '<div class="card"><div class="row"><b>'+a[0]+'</b><span class="tag '+a[3]+'">'+a[2]+'</span></div><div class="mut">'+a[1]+'</div></div>'}).join('')},
bandeja:function(){return '<h2>Incidentes</h2><div class="chips"><button class="chip on">Todos</button><button class="chip">Abiertos</button><button class="chip">Cerrados</button></div>'+[['#128 Luz del pasillo','Edificio B · piso 5','Abierto','bad'],['#127 Puerta de acceso','Edificio A · hall','En revisión','inf'],['#126 Filtración','Edificio C · estacionamiento','En revisión','inf'],['#125 Portón trabado','Acceso vehicular','Resuelto','ok']].map(function(a){return '<div class="card"><div class="row"><b>'+a[0]+'</b><span class="tag '+a[3]+'">'+a[2]+'</span></div><div class="mut">'+a[1]+'</div></div>'}).join('')+'<button class="btn">Cambiar estado del seleccionado</button>'},
reportes:function(){var m=[['May',92],['Jun',88],['Jul',94],['Ago',90],['Sep',85],['Oct',78]];return '<h2>Reportes financieros</h2><div class="row" style="gap:10px"><div class="card hl" style="flex:1"><div class="mut">Recaudado</div><b class="big" style="font-size:22px">$31,2 M</b></div><div class="card" style="flex:1"><div class="mut">Morosidad</div><b class="big" style="font-size:22px;color:var(--bad)">9,4%</b></div></div><div class="card"><b>Recaudación mensual (%)</b><div class="bars">'+m.map(function(x){return '<div style="height:'+x[1]+'%"><i>'+x[1]+'</i></div>'}).join('')+'</div><div class="lab">'+m.map(function(x){return '<span>'+x[0]+'</span>'}).join('')+'</div></div><div class="card"><div class="row"><span>Ingresos</span><b>$35,8 M</b></div><div class="row"><span>Egresos</span><b>$29,4 M</b></div><div class="row"><span>Saldo</span><b style="color:var(--ok)">$6,4 M</b></div></div><button class="btn alt">Exportar reporte</button>'}
};
function go(s){cur=s;if(role[s])R=role[s];draw()}
function draw(){
document.getElementById('menu').innerHTML=L.map(function(x){return '<button class="'+(x[0]==cur?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
document.getElementById('top').innerHTML=cur=='login'?'Condominio Vista Verde':'<div>Condominio Vista Verde</div><span>'+R+'</span>';
var b=document.getElementById('body');b.innerHTML=S[cur]();b.scrollTop=0;
var n=cur=='login'?[]:NAV[R]||NAV.Residente;
document.getElementById('nav').innerHTML=n.map(function(x){var on=x[0]==cur||(x[0]=='boleta'&&cur=='pago');return '<button class="'+(on?'on':'')+'" onclick="go(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>'}).join('')}
draw();
</script>
</body>
</html>
