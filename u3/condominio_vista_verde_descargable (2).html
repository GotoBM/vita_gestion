<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Condominio Vista Verde – Prototipo</title>
<style>
:root{--p:#2F7D4F;--pd:#1B4D33;--pl:#E8F3EC;--bg:#F7F9F7;--card:#fff;--tx:#1F2A24;--mut:#5A6B61;--ac:#F2A93B;--ok:#2E7D32;--pen:#B7791F;--bad:#C0392B;--inf:#2B6CB0;--bd:#D5E2DA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#1A241D;--tx:#EAF1EC;--mut:#A3B5AA;--pl:#22332A;--bd:#2D3F34;--p:#3E9A63}}
:root[data-theme="dark"]{--bg:#101712;--card:#1A241D;--tx:#EAF1EC;--mut:#A3B5AA;--pl:#22332A;--bd:#2D3F34;--p:#3E9A63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.side{flex:1 1 230px;max-width:300px}
.side h1{font-size:20px;color:var(--pd);margin:0 0 4px}.side p{margin:0 0 12px;color:var(--mut);font-size:14px}
.side button{display:block;width:100%;text-align:left;margin:0 0 6px;padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.side button.on{background:var(--p);border-color:var(--p);color:#fff}
.side small{display:block;color:var(--mut);margin-top:10px;font-size:12px}
.phone{width:380px;max-width:100%;height:760px;border:10px solid #1B2A22;border-radius:38px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{background:var(--p);color:#fff;padding:16px 18px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.top span{font-size:13px;font-weight:400;opacity:.9}
.body{flex:1;overflow-y:auto;padding:16px}
.nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
.nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
.nav button b{display:block;font-size:20px}.nav button.on{color:var(--p);font-weight:700}
h2{font-size:20px;margin:0 0 12px;color:var(--pd)}h3{font-size:16px;margin:16px 0 8px}
:root[data-theme="dark"] h2,:root[data-theme="dark"] .big{color:#9fe0b8}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hl{background:var(--pl)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.big{font-size:30px;font-weight:700;color:var(--pd)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.ok{background:var(--ok)}.pen{background:var(--pen)}.bad{background:var(--bad)}.inf{background:var(--inf)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card);color:var(--p);border:2px solid var(--p)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{padding:10px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--p);background:var(--pl);font-weight:700}.chip.dis{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.logo{width:76px;height:76px;border-radius:22px;background:var(--p);color:#fff;font-size:40px;display:grid;place-items:center;margin:20px auto 10px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin:10px 0 4px}
.bars div{flex:1;background:var(--p);border-radius:6px 6px 0 0;position:relative}
.bars div i{position:absolute;top:-18px;left:0;right:0;text-align:center;font:normal 12px sans-serif;color:var(--mut)}
.lab{display:flex;gap:10px}.lab span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.toast{background:var(--ok);color:#fff;padding:12px;border-radius:12px;margin-top:12px;font-weight:600}
.ph{border:2px dashed var(--bd);border-radius:12px;padding:16px;text-align:center;color:var(--mut);margin-bottom:10px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.ic{background:none;border:0;font-size:18px;cursor:pointer;padding:0 0 0 8px;color:#fff}.side h4{margin:12px 0 6px;font-size:13px;color:var(--mut)}.tl{margin:6px 0 0;padding-left:18px}.tl li{margin-bottom:6px}.kp{flex:1}
</style>
</head>
